name: Atualizar dados e publicar

# Um único workflow faz as duas coisas, de propósito:
# commits feitos com GITHUB_TOKEN não disparam outros workflows, então separar
# "atualizar" de "publicar" faria o Pages nunca republicar com a base nova.

on:
  schedule:
    - cron: '10 9 * * *'      # 06:10 em Brasília
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar base SIGA da ANEEL
        id: dados
        continue-on-error: true
        run: python3 scripts/atualizar_dados.py

      - name: Conferir o arquivo gerado
        run: |
          if [ ! -s data/usinas.json ]; then
            echo "### Falha na coleta" >> $GITHUB_STEP_SUMMARY
            echo "O arquivo \`data/usinas.json\` não foi gerado. O site vai subir mesmo assim e pedirá o CSV manualmente." >> $GITHUB_STEP_SUMMARY
            echo "Veja o log do passo *Baixar base SIGA da ANEEL* para o motivo." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          BYTES=$(wc -c < data/usinas.json)
          TOTAL=$(python3 -c "import json;print(json.load(open('data/usinas.json'))['total'])")
          BARR=$(python3 -c "import json;print(json.load(open('data/usinas.json')).get('com_barragem',0))")
          {
            echo "### Base carregada"
            echo ""
            echo "| item | valor |"
            echo "|---|---|"
            echo "| usinas hidrelétricas | $TOTAL |"
            echo "| com classificação de barragem (FSB) | $BARR |"
            echo "| tamanho do arquivo | $(( BYTES / 1024 )) KB |"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$BYTES" -lt 50000 ]; then
            echo ":warning: arquivo suspeito de estar incompleto" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commitar a base se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/usinas.json)" ]; then
            git add data/usinas.json
            git commit -m "dados: atualização automática da base SIGA/ANEEL"
            git push
          else
            echo "Sem alteração na base."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
